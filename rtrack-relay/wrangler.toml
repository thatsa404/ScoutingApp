name = "rtrack-relay"
main = "worker.js"
compatibility_date = "2024-09-23"

# Create with:  wrangler kv namespace create RTRACK_KV
# then paste the printed id below, replacing REPLACE_WITH_KV_ID.
kv_namespaces = [
  { binding = "RTRACK_KV", id = "2cfdf1a3371b456e98911b1d2c851890" }
]

# Two secrets, set with wrangler (never stored here):
#
#   wrangler secret put RTRACK_TOKEN          # home machine: writes + deletes anything
#   wrangler secret put RTRACK_ANSWER_TOKEN   # phone/laptop: POST /answer and /points only
#
# RTRACK_TOKEN goes in robot-tracker's .env. RTRACK_ANSWER_TOKEN is the one you type
# into the curator and calibrator pages at the event — it cannot overwrite a bundle or
# delete anything, so it is safe to leave in a phone's localStorage.
#
# Generate them with something like:
#   python -c "import secrets; print(secrets.token_urlsafe(24))"

#   wrangler secret put RTRACK_CONTROL_TOKEN  # lead scout: POST /control only
#
# RTRACK_CONTROL_TOKEN is what lets the app arm the home machine remotely (Tools ->
# Tracks -> Relay Control). It is a THIRD tier on purpose: it can start and stop real
# work on a machine you own, so it must not be the same value curators type into their
# phones. Leave it unset and /control rejects every POST, which is the safe default.

# The listing (/index) lives in a Durable Object so concurrent writes cannot drop each
# other's entries -- see RelayIndex in worker.js. SQLite-backed, which the free plan allows.
[[durable_objects.bindings]]
name = "RTRACK_INDEX"
class_name = "RelayIndex"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayIndex"]
