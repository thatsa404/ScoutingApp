name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          VITE_TBA_KEY: ${{ secrets.VITE_TBA_KEY }}
          VITE_YOUTUBE_KEY: ${{ secrets.VITE_YOUTUBE_KEY }}
          # Pre-fills the relay URL on the curator/calibrator pages so a scout handed a
          # phone at an event types nothing. Unset is safe: the pages fall back to
          # asking, exactly as before. Set VITE_RTRACK_ANSWER_TOKEN alongside it --
          # publishing the URL without one leaves /answer open to anybody.
          VITE_RTRACK_RELAY: ${{ secrets.VITE_RTRACK_RELAY }}
          VITE_RTRACK_ANSWER_TOKEN: ${{ secrets.VITE_RTRACK_ANSWER_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
